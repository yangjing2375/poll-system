name: PHP Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: poll_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, gd, mbstring
          coverage: none

      - name: Initialize database
        run: mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < sql/schema.sql

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8083 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:8083/api/get_polls.php" > /dev/null && break
            sleep 1
          done
          curl -sf "http://127.0.0.1:8083/api/get_polls.php" > /dev/null

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log
          path: /tmp/php-server.log
